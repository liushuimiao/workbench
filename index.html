<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的日常任务工作台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg:        #f7f5ef;   /* 奶油底 */
    --sidebar:   #14161c;   /* 深色侧栏 */
    --panel:     #ffffff;   /* 卡片白 */
    --text:      #23262e;   /* 主文字 */
    --text-soft: #9a9ea8;   /* 次要灰 */
    --border:    #ececec;   /* 浅描边 */
    --accent:    #111318;   /* 主按钮黑 */
    --pink:      #f4c9dd;
    --pink-2:    #fbe6ef;
    --yellow:    #f4e3a1;
    --yellow-2:  #fbf3d2;
    --green:     #cfe6b0;
    --green-2:   #eaf4d9;
    --blue:      #bcd4f0;
    --blue-2:    #e4eefb;
    --lav:       #d9cdf0;
    --lav-2:     #efe9fa;
    --todo:   #e0a53a;
    --doing:  #4f8fd8;
    --done:   #6fb043;
    --danger: #e5484d;
  }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  body { display: flex; overflow: hidden; }
  input, select, button, textarea { font-family: inherit; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 232px; flex-shrink: 0;
    background: var(--sidebar); color: #e7e8ec;
    display: flex; flex-direction: column; padding: 22px 16px;
    margin: 12px 0 12px 12px; border-radius: 22px;
  }
  .sidebar h1 { font-size: 17px; color: #fff; padding: 4px 10px 2px; font-weight: 600; letter-spacing: .2px; }
  .sidebar .sub { font-size: 12px; color: #757a86; padding: 0 10px 22px; }
  .nav-item {
    position: relative;
    display: flex; align-items: center; gap: 12px;
    padding: 11px 13px; border-radius: 13px; cursor: pointer;
    font-size: 14px; margin-bottom: 3px; user-select: none;
    color: #b9bdc7; transition: background .15s, color .15s;
  }
  .nav-item:hover { background: rgba(255,255,255,.06); color: #eef0f4; }
  .nav-item.active { background: #ffffff; color: #16181e; font-weight: 500; }
  .nav-item .ico { font-size: 17px; width: 22px; text-align: center; }
  .nav-item .cnt {
    margin-left: auto; font-size: 11px; font-weight: 600;
    background: rgba(255,255,255,.12); color: #cfd2d9;
    padding: 2px 9px; border-radius: 11px; min-width: 24px; text-align: center;
  }
  .nav-item.active .cnt { background: #eceef2; color: #4a4e58; }
  .sidebar-footer {
    margin-top: auto; padding: 16px 10px 2px; font-size: 11px;
    color: #6b6f7a; line-height: 1.9;
    border-top: 1px solid rgba(255,255,255,.08); margin-top: 16px;
  }
  .sidebar-footer a { color: #aeb2bd; cursor: pointer; text-decoration: none; border-bottom: 1px dotted #565a64; }
  .sidebar-footer a:hover { color: #fff; }
  #syncStatus { margin-top: 8px; color: #6b6f7a !important; }

  /* ---------- Main ---------- */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .topbar {
    min-height: 70px; flex-shrink: 0; background: transparent;
    display: flex; align-items: center; padding: 8px 30px 0; gap: 14px;
  }
  .topbar .title { font-size: 24px; font-weight: 700; color: var(--text); letter-spacing: -.3px; }
  .topbar .desc { font-size: 13px; color: var(--text-soft); }
  .topbar .spacer { flex: 1; }
  .week-picker { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-soft); }
  .week-picker select {
    border: 1px solid var(--border); border-radius: 22px; padding: 8px 14px;
    font-size: 13px; color: var(--text); background: #fff; cursor: pointer;
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  .week-picker select:focus { outline: none; border-color: #d6d8dd; }

  .readonly-banner {
    background: var(--yellow-2); border: 1px solid #f0e2ad; color: #9a7b1e;
    font-size: 13px; padding: 9px 18px; margin: 0 30px; border-radius: 14px;
    display: none; align-items: center; gap: 12px;
  }
  .readonly-banner.show { display: flex; }
  .readonly-banner a { color: #6b5210; cursor: pointer; text-decoration: underline; }

  .board {
    flex: 1; display: flex; gap: 18px; padding: 18px 30px 26px; overflow-x: auto;
  }
  .board.single { justify-content: center; }
  .column {
    flex: 1; min-width: 250px;
    background: var(--col-tint, #f0f1f3);
    border-radius: 20px;
    display: flex; flex-direction: column; max-height: 100%;
    padding-top: 4px;
  }
  .board.single .column { max-width: 780px; }
  /* 每列不同马卡龙色调（按出现顺序循环） */
  .column:nth-child(5n+1) { --col-tint: var(--yellow-2); --col-accent: var(--yellow); }
  .column:nth-child(5n+2) { --col-tint: var(--pink-2);   --col-accent: var(--pink); }
  .column:nth-child(5n+3) { --col-tint: var(--green-2);  --col-accent: var(--green); }
  .column:nth-child(5n+4) { --col-tint: var(--blue-2);   --col-accent: var(--blue); }
  .column:nth-child(5n+5) { --col-tint: var(--lav-2);    --col-accent: var(--lav); }
  .column-head {
    display: flex; align-items: center; gap: 9px;
    padding: 16px 18px 12px; font-size: 15px; font-weight: 600; color: var(--text);
  }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--col-accent, #c9ccd2); }
  .dot.todo { background: var(--todo); }
  .dot.doing { background: var(--doing); }
  .dot.done { background: var(--done); }
  .column-head .n {
    margin-left: 2px; color: var(--text-soft); font-weight: 600; font-size: 13px;
    background: rgba(255,255,255,.65); padding: 1px 9px; border-radius: 10px;
  }
  .cards {
    flex: 1; overflow-y: auto; padding: 2px 12px 8px;
    display: flex; flex-direction: column; gap: 10px; min-height: 40px;
  }
  .cards.drag-over { background: rgba(0,0,0,.03); border-radius: 14px; }

  .item {
    display: flex; align-items: flex-start; gap: 11px;
    background: var(--panel); border: 1px solid transparent; border-radius: 15px;
    padding: 13px 14px; box-shadow: 0 2px 6px rgba(30,32,40,.05);
    transition: box-shadow .14s, transform .14s;
  }
  .item:hover { box-shadow: 0 4px 12px rgba(30,32,40,.1); }
  .item.dragging { opacity: .4; }
  .item.insert-before { box-shadow: 0 -3px 0 -1px var(--accent), 0 2px 6px rgba(30,32,40,.05); }
  .item.insert-after  { box-shadow: 0 3px 0 -1px var(--accent), 0 2px 6px rgba(30,32,40,.05); }
  .check {
    width: 20px; height: 20px; flex-shrink: 0; margin-top: 1px;
    border: 2px solid #d3d6dd; border-radius: 7px; cursor: pointer; position: relative;
    transition: border-color .12s, background .12s;
  }
  .check:hover { border-color: var(--done); }
  .check.on { background: var(--done); border-color: var(--done); }
  .check.on::after {
    content: ""; position: absolute; left: 6px; top: 2px;
    width: 5px; height: 9px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg);
  }
  .txt {
    flex: 1; font-size: 14px; line-height: 1.55; word-break: break-word;
    cursor: text; padding: 1px 0; border-radius: 6px; color: var(--text);
  }
  .txt:focus { outline: none; background: #f4f6fa; box-shadow: 0 0 0 2px #dbe3f0; padding: 2px 6px; }
  .item.done .txt { text-decoration: line-through; color: var(--text-soft); }
  .del {
    flex-shrink: 0; border: none; background: transparent; color: #c0c3ca; 
    font-size: 18px; cursor: pointer; padding: 0 4px; line-height: 1; border-radius: 7px;
  }
  .del:hover { color: var(--danger); background: #fdeaea; }

  .add-line { padding: 4px 12px 14px; }
  .add-line input {
    width: 100%; border: 1px dashed #cbcdd4; background: rgba(255,255,255,.55);
    border-radius: 13px; padding: 11px 13px; font-size: 13px; color: var(--text);
  }
  .add-line input::placeholder { color: #a9adb6; }
  .add-line input:focus { outline: none; border-style: solid; border-color: #c2c5cc; background: #fff; }

  .empty-hint { font-size: 12px; color: #b7bac2; text-align: center; padding: 14px 0; }

  .sync-overlay {
    position: fixed; inset: 0; background: rgba(20,22,28,.44);
    display: none; align-items: center; justify-content: center; z-index: 60;
  }
  .sync-overlay.show { display: flex; }
  .sync-modal {
    width: 470px; max-width: calc(100vw - 40px); background: #fff;
    border-radius: 22px; padding: 24px 26px; box-shadow: 0 24px 60px rgba(0,0,0,.22);
  }
  .sync-modal h3 { font-size: 17px; margin-bottom: 8px; font-weight: 700; }
  .sync-desc { font-size: 12px; color: var(--text-soft); line-height: 1.7; margin-bottom: 16px; }
  .sync-field { margin-bottom: 14px; }
  .sync-field label { display: block; font-size: 12px; color: var(--text-soft); margin-bottom: 6px; }
  .sync-field input {
    width: 100%; border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 13px; font-size: 13px; color: var(--text); background: #fbfbfc;
  }
  .sync-field input:focus { outline: none; border-color: #c2c5cc; background: #fff; }
  .sync-modal-status { font-size: 12px; color: var(--text-soft); min-height: 16px; margin-bottom: 6px; }
  .sync-actions { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
  .btn { padding: 10px 20px; border-radius: 22px; border: none; font-size: 14px; cursor: pointer; font-weight: 500; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #2b2e36; }
  .btn-ghost { background: #f0f1f4; color: var(--text); }
  .btn-ghost:hover { background: #e6e8ec; }
  .btn-danger { background: transparent; color: var(--danger); margin-right: auto; padding-left: 0; }
  .btn-danger:hover { text-decoration: underline; }

  .toast {
    position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
    background: #23262e; color: #fff; padding: 11px 20px; border-radius: 24px;
    font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 99;
    box-shadow: 0 6px 20px rgba(0,0,0,.25);
  }
  .toast.show { opacity: 1; }

  /* ---------- 手机适配（<= 700px）---------- */
  @media (max-width: 700px) {
    html, body { height: auto; min-height: 100%; }
    body { overflow: auto; align-items: stretch; }

    /* 侧边栏：收窄成只显示图标的窄条 */
    .sidebar {
      width: 66px; padding: 16px 8px; margin: 8px 0 8px 8px; border-radius: 18px;
      position: sticky; top: 8px; height: calc(100vh - 16px); align-self: flex-start;
    }
    .sidebar h1, .sidebar .sub { display: none; }
    .nav-item {
      justify-content: center; padding: 12px 0; gap: 0; margin-bottom: 6px;
    }
    .nav-item > span:not(.ico):not(.cnt) { display: none; } /* 隐藏文字名 */
    .nav-item .ico { width: auto; font-size: 22px; }
    .nav-item .cnt {
      position: absolute; top: 2px; right: 4px; margin: 0;
      min-width: 16px; padding: 0 4px; font-size: 10px; line-height: 16px;
    }
    .sidebar-footer {
      padding: 12px 2px 0; font-size: 9px; text-align: center; line-height: 1.6;
    }
    .sidebar-footer br { display: none; }
    .sidebar-footer a { display: block; margin: 4px 0; }
    #syncStatus { display: none; }

    /* 主区：可纵向滚动 */
    .main { overflow: visible; }
    .topbar {
      min-height: 52px; padding: 14px 16px 4px; gap: 8px; flex-wrap: wrap;
    }
    .topbar .title { font-size: 19px; }
    .topbar .desc { display: none; }
    .week-picker span { display: none; }
    .week-picker select { padding: 7px 12px; max-width: 160px; }

    .readonly-banner { margin: 0 16px; padding: 8px 14px; font-size: 12px; }

    /* 面板：列改为按行纵向排列 */
    .board {
      flex-direction: column; gap: 14px; padding: 14px 16px 24px; overflow-x: visible;
    }
    .board.single { justify-content: flex-start; }
    .column {
      flex: none; width: 100%; min-width: 0; max-height: none;
    }
    .board.single .column { max-width: none; }
    .cards { overflow-y: visible; }
    .item { padding: 14px 14px; }
    .txt { font-size: 15px; }
    .check { width: 22px; height: 22px; }
    .del { font-size: 20px; padding: 0 6px; }
    .add-line input { font-size: 14px; padding: 12px 13px; }

    .sync-modal { padding: 20px 18px; }
  }
</style>
</head>
<body>
  <aside class="sidebar">
    <h1>我的任务工作台</h1>
    <div class="sub">每周固定流程 · 自动保存</div>
    <nav id="nav"></nav>
    <div class="sidebar-footer">
      数据存在本机浏览器，关掉再开还在。<br>
      <a id="exportBtn">导出备份</a> · <a id="importBtn">导入备份</a><br>
      <a id="syncBtn">☁️ 云同步设置</a>
      <div id="syncStatus" style="margin-top:6px;color:#5b6272;"></div>
      <input type="file" id="importFile" accept="application/json" style="display:none">
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="title" id="boardTitle"></div>
      <div class="desc" id="boardDesc"></div>
      <div class="spacer"></div>
      <div class="week-picker">
        <span>周次</span>
        <select id="weekSelect"></select>
      </div>
    </header>
    <div class="readonly-banner" id="roBanner">
      <span id="roText"></span>
      <a id="backToNow">返回本周</a>
    </div>
    <section class="board" id="board"></section>
  </main>

  <div class="sync-overlay" id="syncOverlay">
    <div class="sync-modal">
      <h3>☁️ 云同步设置（Supabase）</h3>
      <p class="sync-desc">填入你的 Supabase 项目地址和 anon key，即可在电脑和手机之间实时同步。留空则只用本机存储。</p>
      <div class="sync-field">
        <label>Supabase URL（项目地址）</label>
        <input type="text" id="sUrl" placeholder="https://xxxx.supabase.co">
      </div>
      <div class="sync-field">
        <label>anon key（公开密钥）</label>
        <input type="text" id="sKey" placeholder="eyJhbGciOi...">
      </div>
      <div class="sync-modal-status" id="sModalStatus"></div>
      <div class="sync-actions">
        <button class="btn btn-danger" id="sDisableBtn">关闭云同步</button>
        <button class="btn btn-ghost" id="sCloseBtn">关闭</button>
        <button class="btn btn-primary" id="sSaveBtn">保存并同步</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "daily_workbench_v3";

  var BOARDS = [
    { id: "publish", name: "官号发布与排期", icon: "\uD83D\uDCC5", desc: "本周待发布与下周排期",
      cols: [
        { id: "thisweek", name: "本周待发布", carryTo: "thisweek" },
        { id: "nextweek", name: "下周排期",   carryTo: "thisweek" }
      ] },
    { id: "ugly", name: "丑东西展", icon: "\uD83E\uDD21", desc: "线下艺术展策划与传播",
      cols: [
        { id: "todo",  name: "待办",   cls: "todo" },
        { id: "doing", name: "进行中", cls: "doing" },
        { id: "done",  name: "已完成", cls: "done", doneCol: true }
      ] },
    { id: "video", name: "爆款视频探索", icon: "\uD83C\uDFAC", desc: "脚本创作与视频产出",
      cols: [
        { id: "script", name: "新脚本" },
        { id: "output", name: "视频产出" }
      ] },
    { id: "ai", name: "AI 实践", icon: "\uD83E\uDD16", desc: "工具、工作流与实验",
      cols: [
        { id: "explore", name: "本周探索" },
        { id: "idea",    name: "工具灵感" },
        { id: "ref",     name: "参考链接" }
      ] },
    { id: "special", name: "特殊事项", icon: "\u2B50", desc: "临时或跨周的特别事项",
      cols: [ { id: "list", name: "事项" } ] }
  ];

  var state = load();
  var currentBoard = BOARDS[0].id;
  var viewWeek = state.currentWeek;   // 当前正在查看的周（可为往期）

  // ================= persistence =================
  function boardConf(id) { return BOARDS.find(function (b) { return b.id === id; }); }

  function freshBoards() {
    var o = {};
    BOARDS.forEach(function (b) {
      o[b.id] = {};
      b.cols.forEach(function (c) { o[b.id][c.id] = []; });
    });
    return o;
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) { var s = JSON.parse(raw); if (s && s.weeks) return normalize(s); }
    } catch (e) {}
    // 从 v2（单列备忘录）迁移
    var boards = freshBoards();
    try {
      var old = localStorage.getItem("daily_workbench_v2");
      if (old) {
        var od = JSON.parse(old);
        BOARDS.forEach(function (b) {
          var arr = (od.items && od.items[b.id]) || [];
          var firstCol = b.cols[0].id;
          boards[b.id][firstCol] = arr.map(function (i) {
            return { id: i.id || uid(), text: i.text, done: !!i.done };
          });
        });
      }
    } catch (e) {}
    var key = getWeekKey(new Date());
    var st = { version: 3, currentWeek: key, weeks: {} };
    st.weeks[key] = { meta: weekMeta(new Date()), boards: boards };
    return st;
  }

  // 确保每周结构里包含所有板块/列（升级时补齐）
  function normalize(s) {
    Object.keys(s.weeks).forEach(function (k) {
      var w = s.weeks[k];
      if (!w.boards) w.boards = freshBoards();
      // 迁移：AI 实践旧单列「list」→ 新的「本周探索(explore)」
      if (w.boards.ai && w.boards.ai.list && w.boards.ai.list.length) {
        if (!w.boards.ai.explore) w.boards.ai.explore = [];
        w.boards.ai.explore = w.boards.ai.explore.concat(w.boards.ai.list);
        delete w.boards.ai.list;
      }
      BOARDS.forEach(function (b) {
        if (!w.boards[b.id]) w.boards[b.id] = {};
        b.cols.forEach(function (c) {
          if (!w.boards[b.id][c.id]) w.boards[b.id][c.id] = [];
        });
      });
    });
    return s;
  }

  function save() {
    state.updatedAt = Date.now();
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch (e) { toast("保存失败：" + e.message); }
    scheduleCloudPush();
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  // ================= cloud sync (Supabase REST) =================
  var SYNC_KEY = "daily_workbench_sync";
  var ROW_ID = "main";
  // 内置默认配置：任何设备打开即自动开启同步，无需手动填写
  var DEFAULT_SYNC = {
    url: "https://uoqfcabsfwfqoftwvahd.supabase.co",
    key: "sb_publishable_pPzp9GxkRnqFs_c6vys9GA_sSpbm2Ba"
  };
  var syncConf = getSyncConf();
  var pushTimer = null;
  var polling = false;

  function getSyncConf() {
    try {
      var raw = localStorage.getItem(SYNC_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { url: DEFAULT_SYNC.url, key: DEFAULT_SYNC.key };
  }
  function setSyncConf(url, key) {
    syncConf = { url: (url || "").replace(/\/+$/, ""), key: key || "" };
    localStorage.setItem(SYNC_KEY, JSON.stringify(syncConf));
  }
  function syncEnabled() { return !!(syncConf.url && syncConf.key); }

  function restHeaders(extra) {
    var h = {
      "apikey": syncConf.key,
      "Authorization": "Bearer " + syncConf.key,
      "Content-Type": "application/json"
    };
    if (extra) Object.keys(extra).forEach(function (k) { h[k] = extra[k]; });
    return h;
  }
  function endpoint() { return syncConf.url + "/rest/v1/workbench"; }

  function scheduleCloudPush() {
    if (!syncEnabled()) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(pushToCloud, 800);
  }

  function pushToCloud() {
    if (!syncEnabled()) return;
    updateSyncStatus("正在上传…");
    fetch(endpoint() + "?on_conflict=id", {
      method: "POST",
      headers: restHeaders({ "Prefer": "resolution=merge-duplicates" }),
      body: JSON.stringify([{ id: ROW_ID, data: state, updated_at: new Date(state.updatedAt || Date.now()).toISOString() }])
    }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      updateSyncStatus("已同步");
    }).catch(function (e) {
      updateSyncStatus("上传失败（已存本地）");
    });
  }

  function pullFromCloud(onDone) {
    if (!syncEnabled()) { if (onDone) onDone(false); return; }
    fetch(endpoint() + "?id=eq." + ROW_ID + "&select=data,updated_at", {
      headers: restHeaders()
    }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).then(function (rows) {
      if (rows && rows.length && rows[0].data) {
        var remote = rows[0].data;
        var localTs = state.updatedAt || 0;
        var remoteTs = remote.updatedAt || 0;
        if (remoteTs > localTs) {
          state = normalize(remote);
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          if (!state.weeks[state.currentWeek]) state.currentWeek = Object.keys(state.weeks).sort().reverse()[0];
          viewWeek = state.currentWeek;
          rolloverIfNeeded();
          renderAll();
          updateSyncStatus("已同步");
          if (onDone) onDone(true);
          return;
        }
      }
      updateSyncStatus("已同步");
      if (onDone) onDone(false);
    }).catch(function (e) {
      updateSyncStatus("连接失败（用本地数据）");
      if (onDone) onDone(false);
    });
  }

  function startPolling() {
    if (polling || !syncEnabled()) return;
    polling = true;
    setInterval(function () { if (syncEnabled()) pullFromCloud(); }, 15000);
  }

  function updateSyncStatus(msg) {
    var el = document.getElementById("syncStatus");
    if (!el) return;
    if (!syncEnabled()) { el.textContent = "未开启云同步（仅本机）"; return; }
    el.textContent = "云同步：" + (msg || "就绪");
  }

  // ================= week helpers =================
  function getWeekKey(date) {
    var d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    var day = (d.getDay() + 6) % 7;      // 周一=0
    d.setDate(d.getDate() - day + 3);    // 移到周四
    var year = d.getFullYear();
    var firstThu = new Date(year, 0, 4);
    var ftDay = (firstThu.getDay() + 6) % 7;
    firstThu.setDate(firstThu.getDate() - ftDay + 3);
    var week = 1 + Math.round((d - firstThu) / (7 * 24 * 3600 * 1000));
    return year + "-W" + (week < 10 ? "0" : "") + week;
  }
  function mondayOf(date) {
    var d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    var day = (d.getDay() + 6) % 7;
    d.setDate(d.getDate() - day);
    return d;
  }
  function weekMeta(date) {
    var mon = mondayOf(date);
    var sun = new Date(mon); sun.setDate(mon.getDate() + 6);
    var f = function (x) { return (x.getMonth() + 1) + "/" + x.getDate(); };
    return { label: f(mon) + "–" + f(sun), monday: mon.getTime() };
  }
  function weekLabelFromKey(key) {
    var w = state.weeks[key];
    var isNow = key === state.currentWeek;
    var wk = key.split("-W")[1];
    var base = "第" + (wk ? parseInt(wk, 10) : "?") + "周";
    if (w && w.meta) base += "（" + w.meta.label + "）";
    if (isNow) base += " · 本周";
    return base;
  }

  // 跨周：把上周未完成项结转到本周
  function rolloverIfNeeded() {
    var nowKey = getWeekKey(new Date());
    if (state.currentWeek === nowKey && state.weeks[nowKey]) return;

    if (!state.weeks[nowKey]) {
      var newBoards = freshBoards();
      var prev = state.weeks[state.currentWeek];
      if (prev && prev.boards) {
        BOARDS.forEach(function (b) {
          b.cols.forEach(function (c) {
            var arr = prev.boards[b.id] && prev.boards[b.id][c.id];
            if (!arr) return;
            arr.forEach(function (it) {
              if (it.done || c.doneCol) return;           // 已完成不结转
              var target = c.carryTo || c.id;
              if (!newBoards[b.id][target]) newBoards[b.id][target] = [];
              newBoards[b.id][target].push({ id: uid(), text: it.text, done: false });
            });
          });
        });
      }
      state.weeks[nowKey] = { meta: weekMeta(new Date()), boards: newBoards };
    }
    state.currentWeek = nowKey;
    viewWeek = nowKey;
    save();
  }

  function boardsOf(weekKey) { return state.weeks[weekKey].boards; }
  function items(weekKey, boardId, colId) { return boardsOf(weekKey)[boardId][colId]; }
  function isReadOnly() { return viewWeek !== state.currentWeek; }

  // ================= render =================
  function renderNav() {
    var nav = document.getElementById("nav");
    nav.innerHTML = "";
    var boards = boardsOf(state.currentWeek); // 导航计数始终看本周
    BOARDS.forEach(function (b) {
      var open = 0;
      b.cols.forEach(function (c) {
        (boards[b.id][c.id] || []).forEach(function (it) {
          if (!it.done && !c.doneCol) open++;
        });
      });
      var el = document.createElement("div");
      el.className = "nav-item" + (b.id === currentBoard ? " active" : "");
      el.title = b.name;
      el.innerHTML = '<span class="ico">' + b.icon + '</span><span>' + b.name +
        '</span><span class="cnt">' + open + '</span>';
      el.onclick = function () { currentBoard = b.id; renderAll(); };
      nav.appendChild(el);
    });
  }

  function renderWeekSelect() {
    var sel = document.getElementById("weekSelect");
    sel.innerHTML = "";
    var keys = Object.keys(state.weeks).sort().reverse();
    keys.forEach(function (k) {
      var opt = document.createElement("option");
      opt.value = k;
      opt.textContent = weekLabelFromKey(k);
      if (k === viewWeek) opt.selected = true;
      sel.appendChild(opt);
    });
    sel.onchange = function () { viewWeek = sel.value; renderAll(); };
  }

  function renderBanner() {
    var b = document.getElementById("roBanner");
    if (isReadOnly()) {
      document.getElementById("roText").textContent =
        "正在查看往期记录：" + weekLabelFromKey(viewWeek) + "（只读，不能修改）";
      b.classList.add("show");
    } else {
      b.classList.remove("show");
    }
  }

  function renderBoard() {
    var conf = boardConf(currentBoard);
    document.getElementById("boardTitle").textContent = conf.icon + " " + conf.name;
    document.getElementById("boardDesc").textContent = conf.desc;

    var board = document.getElementById("board");
    board.innerHTML = "";
    board.className = "board" + (conf.cols.length === 1 ? " single" : "");
    var ro = isReadOnly();

    conf.cols.forEach(function (col) {
      var arr = items(viewWeek, currentBoard, col.id);
      var column = document.createElement("div");
      column.className = "column";

      var head = document.createElement("div");
      head.className = "column-head";
      head.innerHTML = '<span class="dot ' + (col.cls || "") + '"></span>' + col.name +
        ' <span class="n">' + arr.length + '</span>';
      column.appendChild(head);

      var list = document.createElement("div");
      list.className = "cards";
      list.dataset.col = col.id;

      if (!ro) {
        list.addEventListener("dragover", function (e) { e.preventDefault(); list.classList.add("drag-over"); });
        list.addEventListener("dragleave", function () { list.classList.remove("drag-over"); });
        list.addEventListener("drop", function (e) {
          e.preventDefault(); list.classList.remove("drag-over");
          var payload = e.dataTransfer.getData("text/plain");
          moveCard(payload, col.id);
        });
      }

      if (arr.length === 0) {
        var hint = document.createElement("div");
        hint.className = "empty-hint";
        hint.textContent = ro ? "（无）" : "还没有事项";
        list.appendChild(hint);
      }
      arr.forEach(function (it) { list.appendChild(makeItem(it, col, ro)); });
      column.appendChild(list);

      if (!ro) {
        var addWrap = document.createElement("div");
        addWrap.className = "add-line";
        var input = document.createElement("input");
        input.type = "text";
        input.placeholder = "+ 添加到「" + col.name + "」";
        input.addEventListener("keydown", function (e) {
          if (e.key === "Enter") { addItem(col.id, input.value); input.value = ""; }
        });
        addWrap.appendChild(input);
        column.appendChild(addWrap);
      }
      board.appendChild(column);
    });
  }

  function makeItem(it, col, ro) {
    var el = document.createElement("div");
    var isDone = it.done || col.doneCol;
    el.className = "item" + (isDone ? " done" : "");
    el.dataset.id = it.id;

    var check = document.createElement("div");
    check.className = "check" + (it.done ? " on" : "");
    if (!ro) check.onclick = function () { toggleDone(col.id, it.id); };

    var txt = document.createElement("div");
    txt.className = "txt";
    txt.textContent = it.text;
    if (!ro) {
      txt.contentEditable = "true";
      txt.spellcheck = false;
      txt.onblur = function () { updateText(col.id, it.id, txt.textContent); };
      txt.onkeydown = function (e) { if (e.key === "Enter") { e.preventDefault(); txt.blur(); } };
    }

    el.appendChild(check);
    el.appendChild(txt);

    if (!ro) {
      var del = document.createElement("button");
      del.className = "del"; del.innerHTML = "&times;"; del.title = "删除";
      del.onclick = function () { removeItem(col.id, it.id); };
      el.appendChild(del);

      el.draggable = true;
      el.addEventListener("dragstart", function (e) {
        el.classList.add("dragging");
        e.dataTransfer.setData("text/plain", col.id + "::" + it.id);
        e.dataTransfer.effectAllowed = "move";
      });
      el.addEventListener("dragend", function () {
        el.classList.remove("dragging");
        el.classList.remove("insert-before");
        el.classList.remove("insert-after");
      });
      el.addEventListener("dragover", function (e) {
        e.preventDefault();
        var rect = el.getBoundingClientRect();
        var before = (e.clientY - rect.top) < rect.height / 2;
        el.classList.toggle("insert-before", before);
        el.classList.toggle("insert-after", !before);
      });
      el.addEventListener("dragleave", function () {
        el.classList.remove("insert-before");
        el.classList.remove("insert-after");
      });
      el.addEventListener("drop", function (e) {
        e.preventDefault();
        e.stopPropagation();
        var rect = el.getBoundingClientRect();
        var before = (e.clientY - rect.top) < rect.height / 2;
        el.classList.remove("insert-before");
        el.classList.remove("insert-after");
        var payload = e.dataTransfer.getData("text/plain");
        moveCard(payload, col.id, it.id, before);
      });
    }
    return el;
  }

  function renderAll() { renderNav(); renderWeekSelect(); renderBanner(); renderBoard(); }

  // ================= actions (only current week) =================
  function addItem(colId, text) {
    if (isReadOnly()) return;
    text = text.trim(); if (!text) return;
    items(state.currentWeek, currentBoard, colId).push({ id: uid(), text: text, done: false });
    save(); renderAll();
  }
  function updateText(colId, id, text) {
    var arr = items(state.currentWeek, currentBoard, colId);
    var it = arr.find(function (x) { return x.id === id; });
    if (!it) return;
    text = text.trim();
    if (!text) { removeItem(colId, id); return; }
    if (it.text !== text) { it.text = text; save(); }
  }
  function toggleDone(colId, id) {
    var it = items(state.currentWeek, currentBoard, colId).find(function (x) { return x.id === id; });
    if (!it) return;
    it.done = !it.done; save(); renderAll();
  }
  function removeItem(colId, id) {
    var arr = items(state.currentWeek, currentBoard, colId);
    var i = arr.findIndex(function (x) { return x.id === id; });
    if (i > -1) { arr.splice(i, 1); save(); renderAll(); }
  }
  function moveCard(payload, toCol, beforeId, insertBefore) {
    if (isReadOnly()) return;
    var parts = payload.split("::");
    var fromCol = parts[0], id = parts[1];
    if (id === beforeId) return; // 拖到自己身上，忽略
    var src = items(state.currentWeek, currentBoard, fromCol);
    var i = src.findIndex(function (x) { return x.id === id; });
    if (i < 0) return;
    var moved = src.splice(i, 1)[0];
    var dst = items(state.currentWeek, currentBoard, toCol);
    var idx = dst.length; // 默认放末尾（拖到空白区）
    if (beforeId) {
      var ti = dst.findIndex(function (x) { return x.id === beforeId; });
      if (ti > -1) idx = insertBefore ? ti : ti + 1;
    }
    dst.splice(idx, 0, moved);
    save(); renderAll();
  }

  // ================= backup =================
  function exportBackup() {
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    var d = new Date();
    a.download = "工作台备份_" + d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate() + ".json";
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }
  function importBackup(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var data = JSON.parse(reader.result);
        if (!data.weeks) throw new Error("格式不正确");
        state = normalize(data);
        if (!state.weeks[state.currentWeek]) state.currentWeek = Object.keys(state.weeks).sort().reverse()[0];
        viewWeek = state.currentWeek;
        rolloverIfNeeded();
        save(); renderAll();
        toast("导入成功");
      } catch (e) { toast("导入失败：" + e.message); }
    };
    reader.readAsText(file);
  }

  // ================= utils / bind =================
  var toastTimer;
  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 1800);
  }

  document.getElementById("exportBtn").onclick = exportBackup;
  document.getElementById("importBtn").onclick = function () { document.getElementById("importFile").click(); };
  document.getElementById("importFile").onchange = function (e) {
    if (e.target.files[0]) importBackup(e.target.files[0]);
    e.target.value = "";
  };
  document.getElementById("backToNow").onclick = function () {
    viewWeek = state.currentWeek; renderAll();
  };

  // ---- cloud sync modal ----
  var syncOverlay = document.getElementById("syncOverlay");
  function openSync() {
    document.getElementById("sUrl").value = syncConf.url || "";
    document.getElementById("sKey").value = syncConf.key || "";
    document.getElementById("sModalStatus").textContent =
      syncEnabled() ? "当前状态：已开启云同步" : "当前状态：未开启（仅本机）";
    syncOverlay.classList.add("show");
  }
  function closeSync() { syncOverlay.classList.remove("show"); }
  document.getElementById("syncBtn").onclick = openSync;
  document.getElementById("sCloseBtn").onclick = closeSync;
  syncOverlay.onclick = function (e) { if (e.target === syncOverlay) closeSync(); };
  document.getElementById("sSaveBtn").onclick = function () {
    var url = document.getElementById("sUrl").value.trim();
    var key = document.getElementById("sKey").value.trim();
    if (!url || !key) { document.getElementById("sModalStatus").textContent = "请把地址和密钥都填上"; return; }
    setSyncConf(url, key);
    document.getElementById("sModalStatus").textContent = "正在连接云端…";
    pullFromCloud(function () {
      pushToCloud();
      startPolling();
      document.getElementById("sModalStatus").textContent = "已开启云同步！其他设备填相同信息即可打通。";
      toast("云同步已开启");
    });
  };
  document.getElementById("sDisableBtn").onclick = function () {
    setSyncConf("", "");
    updateSyncStatus();
    document.getElementById("sModalStatus").textContent = "已关闭云同步（数据仍在本机）";
    toast("已关闭云同步");
  };

  rolloverIfNeeded();
  renderAll();
  updateSyncStatus();
  if (syncEnabled()) {
    pullFromCloud(function (updated) {
      if (!updated) pushToCloud();
      startPolling();
    });
  }
})();
</script>
</body>
